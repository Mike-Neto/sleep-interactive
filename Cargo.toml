[package]
name = "sleep-interactive"
version = "1.0.5"
edition = "2024"
description = "A sleep like cli application that features a progress indicator and more meaningful argument names"
license = "MIT"
repository = "https://github.com/Mike-Neto/sleep-interactive"
keywords = ["sleep", "progress"]
categories = ["command-line-utilities"]
readme = "README.MD"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
indicatif = "0.18.4"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# standard preferences
blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"
question_mark_used = "allow"
